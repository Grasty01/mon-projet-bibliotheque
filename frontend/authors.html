<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <script type="module" src="js/main.js"></script>
  <title>Gestion des Auteurs</title>
</head>

<body>
  <aside>
    <!-- Bouton de réduction -->
    <div class="reduce-menu-icon">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
        <path d="m14 9 3 3-3 3" />
      </svg>
    </div>

    <!-- Le bloc logo s'ouvre et se ferme ici -->
    <div class="app-logo">
      <div>Le Rayon</div>
      <p>Bibliothèque de quartier</p>
    </div>

    <!-- Navigation principale -->
    <nav class="side-menu">
      <ul>
        <!-- Auteurs (Actif) -->
        <li class="author-item-menu active">
          <a href="authors.html">
            <svg class="icon author-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
              <line x1="16" y1="8" x2="2" y2="22" />
              <line x1="17.5" y1="15" x2="9" y2="15" />
            </svg>
            Auteurs
          </a>
        </li>

        <!-- Livres -->
        <li class="book-item-menu">
          <a href="books.html">
            <svg class="icon book-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
            Livres
          </a>
        </li>

        <!-- Adhérents -->
        <li class="member-item-menu">
          <a href="members.html">
            <svg class="icon member-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Adhérents
          </a>
        </li>

        <!-- Emprunts -->
        <li class="loan-item-menu">
          <a href="loans.html">
            <svg class="icon loan-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m17 2 4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="m7 22-4-4 4-4" />
              <path d="M21 13v1a4 4 0 0 1-4 4H3" />
            </svg>
            Emprunts
          </a>
        </li>

        <!-- Tableau de bord -->
        <li class="dash-item-menu">
          <a href="index.html">
            <svg class="icon dash-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="9" rx="1" />
              <rect x="14" y="3" width="7" height="5" rx="1" />
              <rect x="14" y="12" width="7" height="9" rx="1" />
              <rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
            Tableau de bord
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main>
    <section>
      <h1>Gestion des Auteurs</h1>

      <!-- Bloc Formulaire (Méthode POST) -->
      <article class="form-container">
        <h2>Ajouter un nouvel auteur</h2>
        <form id="create-author-form">
          <div class="form-group">
            <label for="first_name">Prénom</label>
            <input type="text" id="first_name" name="first_name" required placeholder="Ex: Victor" />
          </div>

          <div class="form-group">
            <label for="last_name">Nom</label>
            <input type="text" id="last_name" name="last_name" required placeholder="Ex: Hugo" />
          </div>

          <button type="submit" class="btn-submit">Enregistrer l'auteur</button>
        </form>
        <p id="form-message" class="message"></p>
      </article>

      <!-- Bloc Tableau (Méthode GET) -->
      <article class="table-container">
        <h2>Liste des auteurs</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Prénom</th>
              <th>Nom</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="authors-table-body">
            <!-- Les lignes seront injectées ici via fetch() -->
          </tbody>
        </table>
      </article>

    </section>
  </main>
</body>

</html>
