<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <script type="module" src="js/main.js"></script>
  <title>Tableau de bord</title>
</head>

<body>
  <aside>
    <div class="reduce-menu-icon">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
        <path d="m14 9 3 3-3 3" />
      </svg>
    </div>

    <!-- Le bloc logo s'ouvre et se ferme ici -->
    <div class="app-logo">
      <div>Le Rayon</div>
      <p>Bibliothèque de quartier</p>
    </div>

    <!-- Le menu est maintenant indépendant du logo -->
    <nav class="side-menu">
      <ul>
        <!-- Auteurs -->
        <li class="author-item-menu">
          <a href="authors.html">
            <svg class="icon author-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
              <line x1="16" y1="8" x2="2" y2="22" />
              <line x1="17.5" y1="15" x2="9" y2="15" />
            </svg>
            Auteurs
          </a>
        </li>

        <!-- Livres -->
        <li class="book-item-menu">
          <a href="books.html">
            <svg class="icon book-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
            Livres
          </a>
        </li>

        <!-- Adhérents -->
        <li class="member-item-menu">
          <a href="members.html">
            <svg class="icon member-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Adhérents
          </a>
        </li>

        <!-- Emprunts -->
        <li class="loan-item-menu">
          <a href="loans.html">
            <svg class="icon loan-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m17 2 4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="m7 22-4-4 4-4" />
              <path d="M21 13v1a4 4 0 0 1-4 4H3" />
            </svg>
            Emprunts
          </a>
        </li>

        <!-- Tableau de bord -->
        <li class="dash-item-menu active">
          <a href="index.html">
            <svg class="icon dash-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="9" rx="1" />
              <rect x="14" y="3" width="7" height="5" rx="1" />
              <rect x="14" y="12" width="7" height="9" rx="1" />
              <rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
            Tableau de bord
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main>
    <section>
      <h1>Tableau de bord</h1>

      <!-- Regroupe la partie qui affiche les chiffres clés -->
      <div class="board">
        <article class="board-book-item">
          <h2 class="board-book-title">Livres</h2>
          <p class="board-book-number"></p>
        </article>

        <article class="board-member-item">
          <h2 class="board-member-title">Adhérents</h2>
          <p class="board-member-number"></p>
        </article>

        <article class="board-loan-item">
          <h2 class="board-loan-title">Emprunts en cours</h2>
          <p class="board-loan-number"></p>
        </article>

        <article class="board-late-loan-item">
          <h2 class="board-late-loan-title">Emprunts en retard</h2>
          <p class="board-late-loan-number"></p>
          <a href="#" class="board-late-loan-link">Voir la liste</a>
        </article>
      </div>

      <!-- Regroupe la partie qui affiche les tops (classements) -->
      <div class="states">
        <article class="states-most-popular-book">
          <span>Livre le plus emprunté</span>
          <h3 class="most-popular-book-title"></h3>
          <p class="most-popular-book-author-name"></p>
          <p class="most-popular-book-loan-number"></p>
        </article>

        <article class="states-most-loan-member">
          <span>Adhérent le plus actif</span>
          <h3 class="most-loan-member-name"></h3>
          <p class="most-loan-member-infos"></p>
          <p class="most-loan-member-name-loan-number"></p>
        </article>
      </div>
    </section>
  </main>
</body>

</html>
